name: Catalog

on:
  push:
    branches: ["main"]
  pull_request:
  # A pinned release can be deleted or retagged upstream after this catalog
  # merges, so re-verify on a schedule rather than only on change.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify catalog against pinned releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify structure and every pinned release
        run: python scripts/check_catalog.py
